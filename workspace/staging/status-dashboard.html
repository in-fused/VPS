<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Service Status — in-fused.org</title>
<style>
  :root {
    --bg: #0a0e17; --surface: #111827; --border: #1e293b;
    --gold: #d4a017; --gold-dim: #b8860b; --cyan: #06b6d4;
    --green: #10b981; --red: #ef4444; --yellow: #f59e0b;
    --text: #e2e8f0; --text-sec: #94a3b8; --text-muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    background: var(--bg); color: var(--text);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center; padding: 20px 0 16px;
    border-bottom: 1px solid var(--border); margin-bottom: 16px;
  }
  header h1 { font-size: 18px; color: var(--gold); letter-spacing: 1px; }
  header p { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .status-bar {
    display: flex; justify-content: center; gap: 16px;
    padding: 10px 0; margin-bottom: 16px;
    font-size: 12px; color: var(--text-sec);
  }
  .status-bar .count { font-weight: 700; }
  .status-bar .ok { color: var(--green); }
  .status-bar .warn { color: var(--yellow); }
  .status-bar .err { color: var(--red); }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 14px;
    min-height: 64px; /* 44px touch + padding */
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--gold-dim); }
  .indicator {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    box-shadow: 0 0 6px currentColor;
  }
  .indicator.up { color: var(--green); background: var(--green); }
  .indicator.down { color: var(--red); background: var(--red); }
  .indicator.checking { color: var(--yellow); background: var(--yellow); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .info { flex: 1; min-width: 0; }
  .info .name { font-size: 14px; font-weight: 600; color: var(--text); }
  .info .desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .meta { text-align: right; flex-shrink: 0; }
  .meta .port { font-size: 12px; color: var(--cyan); }
  .meta .mem { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .meta .latency { font-size: 10px; color: var(--text-sec); margin-top: 1px; }
  footer {
    text-align: center; padding: 16px 0; margin-top: 8px;
    font-size: 10px; color: var(--text-muted);
    border-top: 1px solid var(--border);
  }
  .refresh-btn {
    display: inline-block; padding: 8px 20px; margin-top: 12px;
    background: transparent; border: 1px solid var(--gold-dim);
    color: var(--gold); border-radius: 6px; font-family: inherit;
    font-size: 12px; cursor: pointer; min-height: 44px;
    transition: background 0.2s;
  }
  .refresh-btn:hover, .refresh-btn:active { background: rgba(212,160,23,0.1); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>⚡ SERVICE STATUS</h1>
    <p>in-fused.org — <span id="timestamp"></span></p>
  </header>

  <div class="status-bar">
    <span><span class="count ok" id="up-count">0</span> Up</span>
    <span><span class="count err" id="down-count">0</span> Down</span>
    <span>Last check: <span id="last-check">—</span></span>
  </div>

  <div id="services"></div>

  <div style="text-align:center">
    <button class="refresh-btn" onclick="checkAll()">Refresh All</button>
  </div>

  <footer>
    Auto-refreshes every 30s · Powered by Mission Control
  </footer>
</div>

<script>
const SERVICES = [
  { name: 'Caddy', desc: 'Reverse proxy, auto-HTTPS, cookie auth', port: '80/443', mem: '64M',
    check: '/auth/verify', expectStatus: [401, 200] },
  { name: 'Landing Page', desc: 'Quick chat + hub directory', port: '-', mem: '-',
    check: '/', expectStatus: [200] },
  { name: 'LiteLLM', desc: 'Unified gateway — 25+ models, 6 providers', port: '4000', mem: '512M',
    check: '/api/litellm/health', expectStatus: [200] },
  { name: 'OpenClaw', desc: 'Autonomous agent runtime (24/7)', port: '18789', mem: '1536M',
    check: '/openclaw/', expectStatus: [200] },
  { name: 'Scrapling', desc: 'Web scraping API for agents (internal)', port: '8000', mem: '256M',
    check: null, internal: true },
  { name: 'LiteLLM DB', desc: 'PostgreSQL 16 for LiteLLM state', port: '5432', mem: '128M',
    check: null, internal: true },
];

function render() {
  const el = document.getElementById('services');
  el.innerHTML = SERVICES.map((s, i) => `
    <div class="card" id="svc-${i}">
      <div class="indicator checking" id="ind-${i}"></div>
      <div class="info">
        <div class="name">${s.name}</div>
        <div class="desc">${s.desc}</div>
      </div>
      <div class="meta">
        <div class="port">:${s.port}</div>
        <div class="mem">${s.mem}</div>
        <div class="latency" id="lat-${i}"></div>
      </div>
    </div>
  `).join('');
}

async function checkService(svc, idx) {
  const ind = document.getElementById('ind-' + idx);
  const lat = document.getElementById('lat-' + idx);
  ind.className = 'indicator checking';

  if (!svc.check) {
    // Internal-only service — can't check from browser
    ind.className = 'indicator up';
    lat.textContent = 'internal';
    return true;
  }

  const start = performance.now();
  try {
    const resp = await fetch(svc.check, {
      signal: AbortSignal.timeout(8000),
      mode: 'no-cors',
      cache: 'no-store',
    });
    const ms = Math.round(performance.now() - start);
    // no-cors returns opaque response (status 0), treat as up
    const isUp = resp.status === 0 || svc.expectStatus.includes(resp.status);
    ind.className = isUp ? 'indicator up' : 'indicator down';
    lat.textContent = ms + 'ms';
    return isUp;
  } catch {
    const ms = Math.round(performance.now() - start);
    ind.className = 'indicator down';
    lat.textContent = ms > 7000 ? 'timeout' : 'error';
    return false;
  }
}

async function checkAll() {
  const results = await Promise.all(SERVICES.map((s, i) => checkService(s, i)));
  const up = results.filter(Boolean).length;
  document.getElementById('up-count').textContent = up;
  document.getElementById('down-count').textContent = results.length - up;
  document.getElementById('last-check').textContent = new Date().toLocaleTimeString();
}

document.getElementById('timestamp').textContent = new Date().toLocaleDateString();
render();
checkAll();
setInterval(checkAll, 30000);
</script>
</body>
</html>
