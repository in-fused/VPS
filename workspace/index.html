<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>in-fused.org — Neural Fusion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #050508;
      color: #e0e0e0;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ===== Canvas Background ===== */
    #neural-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ===== Hub Content (default state) ===== */
    .hub {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    body.fused .hub {
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
    }

    .brand {
      font-size: 2.4rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
      text-shadow: 0 0 40px rgba(96, 165, 250, 0.3);
      transition: text-shadow 0.8s ease;
    }

    .tagline {
      color: #666;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    /* ===== Status Row ===== */
    .status-row {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 0.8rem 1.2rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 140px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.online {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
      animation: pulse 2s infinite;
    }

    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-label {
      font-size: 0.8rem;
      color: #888;
    }

    .status-label span {
      display: block;
      font-size: 0.7rem;
      color: #555;
      margin-top: 1px;
    }

    /* ===== Enter the Grid Button ===== */
    .enter-grid {
      position: relative;
      background: rgba(96, 165, 250, 0.08);
      border: 1px solid rgba(96, 165, 250, 0.25);
      border-radius: 12px;
      padding: 1rem 2.5rem;
      color: #60a5fa;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .enter-grid::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.2), transparent, rgba(96, 165, 250, 0.1));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }

    .enter-grid:hover {
      border-color: rgba(96, 165, 250, 0.5);
      background: rgba(96, 165, 250, 0.12);
      box-shadow: 0 0 30px rgba(96, 165, 250, 0.15);
      transform: translateY(-1px);
    }

    .enter-grid:hover::before {
      opacity: 1;
    }

    /* ===== Nav Links ===== */
    .nav {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav a {
      color: #555;
      text-decoration: none;
      padding: 0.45rem 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      font-size: 0.78rem;
      transition: all 0.2s ease;
    }

    .nav a:hover {
      color: #60a5fa;
      border-color: rgba(96, 165, 250, 0.3);
    }

    /* ===== OpenClaw Panel (fused state) ===== */
    .grid-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    body.fused .grid-panel {
      opacity: 1;
      pointer-events: auto;
    }

    .iframe-container {
      position: relative;
      width: 92vw;
      height: 85vh;
      max-width: 1400px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(10, 10, 15, 0.6);
      border: 1px solid rgba(245, 158, 11, 0.15);
      box-shadow:
        0 0 60px rgba(245, 158, 11, 0.08),
        inset 0 0 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transform: scale(0.95);
      transition: transform 0.6s ease, border-color 0.8s ease, box-shadow 0.8s ease;
    }

    body.fused .iframe-container {
      transform: scale(1);
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 16px;
    }

    /* Animated glow border */
    .iframe-container::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 18px;
      background: conic-gradient(
        from var(--glow-angle, 0deg),
        transparent 0%,
        rgba(245, 158, 11, 0.3) 10%,
        transparent 20%,
        transparent 50%,
        rgba(245, 158, 11, 0.2) 60%,
        transparent 70%
      );
      z-index: -1;
      animation: glow-spin 4s linear infinite;
    }

    @keyframes glow-spin {
      to { --glow-angle: 360deg; }
    }

    @property --glow-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    /* ===== Exit Grid Button ===== */
    .exit-grid {
      position: absolute;
      top: 12px;
      right: 16px;
      z-index: 30;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0.4rem 0.9rem;
      color: #888;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .exit-grid:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.8);
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .brand { font-size: 1.8rem; }
      .status-row { gap: 0.8rem; }
      .status-card { min-width: 120px; padding: 0.6rem 0.9rem; }
      .iframe-container { width: 96vw; height: 88vh; border-radius: 10px; }
      .enter-grid { padding: 0.8rem 1.8rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <canvas id="neural-canvas"></canvas>

  <!-- Hub Content -->
  <div class="hub">
    <h1 class="brand">in-fused</h1>
    <p class="tagline">Autonomous AI Hub</p>

    <div class="status-row">
      <div class="status-card">
        <div class="status-dot" id="status-webui"></div>
        <div class="status-label">Open WebUI<span>Chat Interface</span></div>
      </div>
      <div class="status-card">
        <div class="status-dot" id="status-litellm"></div>
        <div class="status-label">LiteLLM<span>Model Router</span></div>
      </div>
      <div class="status-card">
        <div class="status-dot" id="status-openclaw"></div>
        <div class="status-label">OpenClaw<span>Agent Gateway</span></div>
      </div>
    </div>

    <button class="enter-grid" onclick="enterGrid()">Enter the Grid</button>

    <nav class="nav">
      <a href="/chat">Open WebUI</a>
      <a href="/openclaw/">OpenClaw Direct</a>
      <a href="/api/litellm/">LiteLLM API</a>
    </nav>
  </div>

  <!-- OpenClaw Iframe Panel -->
  <div class="grid-panel">
    <div class="iframe-container">
      <button class="exit-grid" onclick="exitGrid()">Exit Grid</button>
      <iframe id="openclaw-frame" allow="clipboard-write" loading="lazy"></iframe>
    </div>
  </div>

  <script>
    // =========================================================================
    // Neural Network Canvas
    // =========================================================================
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');
    let nodes = [];
    let mouse = { x: -1000, y: -1000 };
    let isFused = false;
    let colorTransition = 0; // 0 = blue, 1 = amber
    const NODE_COUNT_DESKTOP = 65;
    const NODE_COUNT_MOBILE = 35;
    const CONNECTION_DIST = 180;
    const MOUSE_RADIUS = 200;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function isMobile() {
      return window.innerWidth < 768;
    }

    function initNodes() {
      const count = isMobile() ? NODE_COUNT_MOBILE : NODE_COUNT_DESKTOP;
      nodes = [];
      for (let i = 0; i < count; i++) {
        nodes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          radius: Math.random() * 2 + 1,
          baseAlpha: Math.random() * 0.4 + 0.2,
        });
      }
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    function getNodeColor(alpha) {
      const r = Math.round(lerp(96, 245, colorTransition));
      const g = Math.round(lerp(165, 158, colorTransition));
      const b = Math.round(lerp(250, 11, colorTransition));
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function getLineColor(alpha) {
      const r = Math.round(lerp(30, 146, colorTransition));
      const g = Math.round(lerp(58, 100, colorTransition));
      const b = Math.round(lerp(95, 6, colorTransition));
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Smooth color transition
      const targetColor = isFused ? 1 : 0;
      colorTransition += (targetColor - colorTransition) * 0.02;

      const speedMult = lerp(1, 1.8, colorTransition);
      const distMult = lerp(1, 1.3, colorTransition);
      const connDist = CONNECTION_DIST * distMult;

      // Update nodes
      for (const node of nodes) {
        node.x += node.vx * speedMult;
        node.y += node.vy * speedMult;

        // Wrap around edges
        if (node.x < -10) node.x = canvas.width + 10;
        if (node.x > canvas.width + 10) node.x = -10;
        if (node.y < -10) node.y = canvas.height + 10;
        if (node.y > canvas.height + 10) node.y = -10;

        // Mouse attraction
        const dx = mouse.x - node.x;
        const dy = mouse.y - node.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MOUSE_RADIUS && dist > 0) {
          const force = (1 - dist / MOUSE_RADIUS) * 0.015;
          node.vx += dx * force;
          node.vy += dy * force;
        }

        // Dampen velocity
        node.vx *= 0.99;
        node.vy *= 0.99;
      }

      // Draw connections
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < connDist) {
            const alpha = (1 - dist / connDist) * 0.35;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.strokeStyle = getLineColor(alpha);
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      // Draw nodes
      for (const node of nodes) {
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.fillStyle = getNodeColor(node.baseAlpha);
        ctx.fill();

        // Glow effect
        const glowSize = node.radius * 4;
        const gradient = ctx.createRadialGradient(
          node.x, node.y, 0,
          node.x, node.y, glowSize
        );
        gradient.addColorStop(0, getNodeColor(node.baseAlpha * 0.3));
        gradient.addColorStop(1, getNodeColor(0));
        ctx.beginPath();
        ctx.arc(node.x, node.y, glowSize, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    // =========================================================================
    // Grid Enter/Exit
    // =========================================================================
    function enterGrid() {
      isFused = true;
      document.body.classList.add('fused');
      // Load iframe only on first enter
      const frame = document.getElementById('openclaw-frame');
      if (!frame.src) {
        frame.src = '/openclaw/';
      }
    }

    function exitGrid() {
      isFused = false;
      document.body.classList.remove('fused');
    }

    // Escape key exits grid
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isFused) exitGrid();
    });

    // =========================================================================
    // Status Checks
    // =========================================================================
    async function checkStatus(id, url) {
      const dot = document.getElementById(id);
      try {
        const res = await fetch(url, { method: 'HEAD', mode: 'no-cors' });
        // no-cors returns opaque response; if fetch doesn't throw, host is up
        dot.classList.add('online');
        dot.classList.remove('offline');
      } catch {
        dot.classList.add('offline');
        dot.classList.remove('online');
      }
    }

    function checkAllStatus() {
      checkStatus('status-webui', '/');
      checkStatus('status-litellm', '/api/litellm/health/liveliness');
      checkStatus('status-openclaw', '/openclaw/');
    }

    // =========================================================================
    // Mouse Tracking
    // =========================================================================
    document.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    document.addEventListener('mouseleave', () => {
      mouse.x = -1000;
      mouse.y = -1000;
    });

    // Touch support
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    });

    document.addEventListener('touchend', () => {
      mouse.x = -1000;
      mouse.y = -1000;
    });

    // =========================================================================
    // Init
    // =========================================================================
    window.addEventListener('resize', () => {
      resize();
      initNodes();
    });

    resize();
    initNodes();
    animate();
    checkAllStatus();
    // Re-check status every 30 seconds
    setInterval(checkAllStatus, 30000);
  </script>
</body>
</html>
