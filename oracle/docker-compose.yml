###############################################################################
# Docker Compose — Oracle ARM Services (LiteLLM + Scrapling + SearXNG)
###############################################################################
# These services were migrated off EC2 t3.small to free memory for OpenClaw.
# Ollama runs natively on this host (systemd) — not in Docker.
#
# Start:   docker compose up -d
# Logs:    docker compose logs -f
# Stop:    docker compose down
###############################################################################

services:

  # ===========================================================================
  # LiteLLM Database — PostgreSQL
  # ===========================================================================
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmproxy -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # LiteLLM — Multi-Provider API Gateway
  # ===========================================================================
  litellm:
    image: ghcr.io/berriai/litellm:v1.82.3-stable.patch.2
    container_name: litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_BIND_IP:-0.0.0.0}:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - DATABASE_URL=postgresql://llmproxy:${DB_PASSWORD}@litellm-db:5432/litellm
      - STORE_MODEL_IN_DB=True
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_API_KEY_2=${GROQ_API_KEY_2:-}
      - GROQ_API_KEY_3=${GROQ_API_KEY_3:-}
      - GROQ_API_KEY_4=${GROQ_API_KEY_4:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2:-}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      # Ollama runs natively on this host — reach it via host.docker.internal
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - ai-net
    depends_on:
      litellm-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD-SHELL
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ===========================================================================
  # Scrapling — Web Scraping API for Agents
  # ===========================================================================
  scrapling:
    build:
      context: ./scrapling
      dockerfile: Dockerfile
    image: in-fused/scrapling:latest
    container_name: scrapling
    restart: unless-stopped
    ports:
      - "${SCRAPLING_BIND_IP:-0.0.0.0}:8000:8000"
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # SearXNG — Self-hosted meta search engine
  # ===========================================================================
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    ports:
      - "${SEARXNG_BIND_IP:-0.0.0.0}:8080:8080"
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ai-net:
    driver: bridge
    name: oracle-ai-net

volumes:
  litellm-db-data:
