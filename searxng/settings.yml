# SearXNG — self-hosted meta search engine for OpenClaw agents
# Internal only (no external ports). Agents query via exec wget.

use_default_settings: true

server:
  secret_key: "openclaw-searxng-internal-only"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false  # internal use only, no rate limiting needed

search:
  formats:
    - html
    - json

# Disable UI features we don't need (agents use JSON API only)
ui:
  static_use_hash: true

# Enable common search engines
engines:
  - name: google
    engine: google
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    disabled: false
  - name: bing
    engine: bing
    disabled: false
  - name: wikipedia
    engine: wikipedia
    disabled: false
