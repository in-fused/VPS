###############################################################################
# Docker Compose — VPS Unified AI Hub
###############################################################################
# Core services (always running):
#   - caddy:      Reverse proxy + auto-HTTPS
#   - open-webui: ChatGPT-like frontend
#   - litellm:    Multi-provider API gateway
#   - openclaw:   Autonomous AI agent (24/7 background tasks)
#
# Optional profiles:
#   - ollama (profile: local-models): Only if running Ollama on THIS server
#     Enable with: docker compose --profile local-models up -d
#
# Start core stack:  docker compose up -d
# View logs:         docker compose logs -f
# Stop:              docker compose down
###############################################################################

services:

  # ===========================================================================
  # Caddy — Reverse Proxy + Auto-HTTPS
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-}
    networks:
      - ai-net
    depends_on:
      - open-webui
      - litellm
    deploy:
      resources:
        limits:
          memory: 64M

  # ===========================================================================
  # Open WebUI — Unified AI Frontend
  # ===========================================================================
  # ChatGPT-like interface that connects to all your AI providers.
  # First user to sign up becomes admin.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    volumes:
      - webui-data:/app/backend/data
    environment:
      # Connect to LiteLLM as the OpenAI-compatible backend
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      # Connect to remote Ollama (Oracle Cloud) if configured
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      # Security
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_AUTH=true
      # Features
      - ENABLE_RAG_WEB_SEARCH=true
      - ENABLE_IMAGE_GENERATION=false
    networks:
      - ai-net
    depends_on:
      - litellm
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # LiteLLM — Multi-Provider API Gateway
  # ===========================================================================
  # Routes requests to the cheapest adequate model.
  # Supports Claude, ChatGPT, DeepSeek, Groq, Ollama, and more.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # OpenClaw — Autonomous AI Agent (24/7)
  # ===========================================================================
  # Runs as a background autonomous agent connected to your LLM providers.
  # Can execute tasks, run code, and work autonomously.
  #
  # Access via the configured messaging platform (Telegram, Discord, etc.)
  # See README for messaging platform setup.
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    volumes:
      - openclaw-data:/home/user
    environment:
      # OpenClaw connects to LiteLLM for model access
      - OPENAI_API_BASE=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      # Direct provider keys (fallback if LiteLLM is down)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Default model for autonomous tasks (use a cheap one!)
      - OPENCLAW_MODEL=${OPENCLAW_MODEL:-gpt-4o-mini}
    networks:
      - ai-net
    depends_on:
      litellm:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================================================
  # Ollama — Local LLM Server (OPTIONAL — for same-box deployment)
  # ===========================================================================
  # Only enable if running Ollama on THIS server (not recommended for t2.micro).
  # For Oracle Cloud deployment, use scripts/setup-ollama-server.sh instead.
  #
  # Enable with: docker compose --profile local-models up -d
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    profiles:
      - local-models
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 4G

# =============================================================================
# Networks
# =============================================================================
networks:
  ai-net:
    driver: bridge
    name: ai-hub-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  caddy-data:
  caddy-config:
  webui-data:
  openclaw-data:
  ollama-data:
