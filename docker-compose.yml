###############################################################################
# Docker Compose — VPS Unified AI Hub
###############################################################################
# Core services (always running):
#   - caddy:      Reverse proxy + auto-HTTPS
#   - open-webui: ChatGPT-like frontend
#   - litellm:    Multi-provider API gateway
#   - openclaw:   Autonomous AI agent (24/7 background tasks)
#
# Optional profiles:
#   - ollama (profile: local-models): Only if running Ollama on THIS server (GPU instance recommended)
#     Enable with: docker compose --profile local-models up -d
#
# Start core stack:  docker compose up -d
# View logs:         docker compose logs -f
# Stop:              docker compose down
###############################################################################

services:

  # ===========================================================================
  # Caddy — Reverse Proxy + Auto-HTTPS
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - agent-workspace:/srv/workspace:ro
      - ./portal:/srv/portal:ro
    environment:
      - DOMAIN=${DOMAIN:-}
    networks:
      - ai-net
    depends_on:
      - open-webui
      - litellm
    deploy:
      resources:
        limits:
          memory: 64M

  # ===========================================================================
  # Open WebUI — Unified AI Frontend
  # ===========================================================================
  # ChatGPT-like interface that connects to all your AI providers.
  # First user to sign up becomes admin.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    volumes:
      - webui-data:/app/backend/data
    environment:
      # Connect to LiteLLM as the OpenAI-compatible backend
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      # Connect to remote Ollama (Oracle Cloud) if configured
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      # Security
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_AUTH=true
      # Features
      - ENABLE_RAG_WEB_SEARCH=true
      - ENABLE_IMAGE_GENERATION=false
    networks:
      - ai-net
    depends_on:
      - litellm
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # LiteLLM Database — PostgreSQL
  # ===========================================================================
  # Required by LiteLLM for Prisma migrations, virtual keys, and spend tracking.
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dbpassword9090}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmproxy -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # LiteLLM — Multi-Provider API Gateway
  # ===========================================================================
  # Routes requests to the cheapest adequate model.
  # Supports Claude, ChatGPT, DeepSeek, Groq, Ollama, and more.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - DATABASE_URL=postgresql://llmproxy:${DB_PASSWORD:-dbpassword9090}@litellm-db:5432/litellm
      - STORE_MODEL_IN_DB=True
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
    networks:
      - ai-net
    depends_on:
      litellm-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD-SHELL
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # OpenClaw — Autonomous AI Agent (24/7)
  # ===========================================================================
  # Open-source autonomous AI agent (Node.js). Connects to LLM providers
  # and messaging platforms (Telegram, Discord, WhatsApp, Signal, etc.)
  #
  # FIRST RUN: After 'docker compose up -d', run the onboarding wizard:
  #   docker compose exec -it openclaw node openclaw.mjs onboard
  #
  # Web interface available at /openclaw/ via Caddy reverse proxy.
  # Agent workspace served at /workspace/ — agents can create pages and features here.
  # Config persisted in openclaw-data volume (~/.openclaw/).
  # See README Part 4 for full setup guide.
  openclaw:
    image: ghcr.io/openclaw/openclaw:main
    container_name: openclaw
    restart: unless-stopped
    volumes:
      - openclaw-data:/home/node/.openclaw
      - agent-workspace:/workspace
      - ./scripts:/opt/scripts:ro
    command: ["/bin/sh", "/opt/scripts/openclaw-entrypoint.sh"]
    environment:
      # Skip entry.js respawn — we supply the V8 flags and warning suppression directly
      - OPENCLAW_NODE_OPTIONS_READY=1
      - NODE_OPTIONS=--max-old-space-size=1024 --disable-warning=ExperimentalWarning
      # Gateway auth — password required to access the /openclaw/ web UI
      - OPENCLAW_GATEWAY_PASSWORD=${OPENCLAW_PASSWORD}
      # Route everything through LiteLLM — no direct provider keys needed
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
    networks:
      - ai-net
    depends_on:
      litellm:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18789/openclaw/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ===========================================================================
  # Workspace Init — Seeds the agent workspace volume with placeholder content
  # ===========================================================================
  # Runs once on deploy to copy workspace/ files into the shared volume.
  # Only copies if index.html doesn't already exist (won't overwrite agent work).
  workspace-init:
    image: alpine:3
    container_name: workspace-init
    volumes:
      - ./workspace:/seed:ro
      - agent-workspace:/workspace
    command: >
      sh -c "[ -f /workspace/index.html ] && echo 'Workspace already initialized' || cp -r /seed/. /workspace/"
    restart: "no"

  # ===========================================================================
  # Ollama — Local LLM Server (OPTIONAL — for same-box deployment)
  # ===========================================================================
  # Only enable if running Ollama on THIS server (GPU instance recommended).
  # For Oracle Cloud deployment, use scripts/setup-ollama-server.sh instead.
  #
  # Enable with: docker compose --profile local-models up -d
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    profiles:
      - local-models
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 4G

# =============================================================================
# Networks
# =============================================================================
networks:
  ai-net:
    driver: bridge
    name: ai-hub-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  caddy-data:
  caddy-config:
  webui-data:
  litellm-db-data:
  openclaw-data:
  agent-workspace:
  ollama-data:
