###############################################################################
# Docker Compose — VPS Unified AI Hub (EC2)
###############################################################################
# Core services (always running on EC2):
#   - caddy:      Reverse proxy + auto-HTTPS + landing page
#   - openclaw:   Autonomous AI agent (24/7 background tasks)
#   - webhook:    External workflow trigger handler
#   - watchtower: Auto-update OpenClaw image
#
# Migrated to Oracle ARM (see oracle/docker-compose.yml):
#   - litellm:    Multi-provider API gateway → http://ORACLE_ARM_IP:4000
#   - litellm-db: PostgreSQL for LiteLLM
#   - scrapling:  Web scraping API → http://ORACLE_ARM_IP:8000
#   - searxng:    Meta search engine → http://ORACLE_ARM_IP:8080
#   - ollama:     LLM inference (native, not Docker)
#
# Deploy Oracle services first: bash scripts/deploy-oracle.sh
# Then deploy EC2:              bash scripts/deploy.sh
#
# Start core stack:  docker compose up -d
# View logs:         docker compose logs -f
# Stop:              docker compose down
###############################################################################

services:

  # ===========================================================================
  # Caddy — Reverse Proxy + Auto-HTTPS
  # ===========================================================================
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: in-fused/caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./scripts:/opt/scripts:ro
      - caddy-data:/data
      - caddy-config:/config
      - agent-workspace:/srv/workspace:ro
    command: ["/bin/sh", "/opt/scripts/caddy-entrypoint.sh"]
    environment:
      - DOMAIN=${DOMAIN:-}
      - WORKSPACE_PASSWORD=${OPENCLAW_PASSWORD}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # Oracle ARM — LiteLLM runs there now
      - ORACLE_LITELLM_URL=${ORACLE_LITELLM_URL:-http://localhost:4000}
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 64M

  # ===========================================================================
  # Oracle Tunnel — SSH port-forward for Oracle ARM services
  # ===========================================================================
  # Oracle Cloud VCN Security Lists block inbound traffic on ports 4000/8000/8080
  # even when VM-level iptables allows it. This container tunnels those ports
  # through SSH (port 22, which IS open) so Caddy and OpenClaw can reach
  # LiteLLM, Scrapling, and SearXNG without needing Oracle Console firewall changes.
  #
  # Forwards:  oracle-tunnel:4000 → Oracle:4000 (LiteLLM)
  #            oracle-tunnel:8000 → Oracle:8000 (Scrapling)
  #            oracle-tunnel:8080 → Oracle:8080 (SearXNG)
  #
  # Requires: oracle-instance-key (SSH private key for ubuntu@ORACLE_ARM_IP)
  # If key is empty/missing, the tunnel sleeps — other services degrade gracefully.
  oracle-tunnel:
    image: alpine:3
    container_name: oracle-tunnel
    restart: unless-stopped
    volumes:
      - ./oracle-instance-key:/root/.ssh/oracle-key:ro
    environment:
      - ORACLE_ARM_IP=${ORACLE_ARM_IP:-}
    command: >
      sh -c "
        if [ -z \"$$ORACLE_ARM_IP\" ]; then
          echo '[oracle-tunnel] ORACLE_ARM_IP not set — tunnel disabled, sleeping';
          exec sleep infinity;
        fi;
        if [ ! -s /root/.ssh/oracle-key ]; then
          echo '[oracle-tunnel] oracle-instance-key is empty — tunnel disabled, sleeping';
          exec sleep infinity;
        fi;
        apk add --no-cache openssh-client > /dev/null 2>&1;
        chmod 600 /root/.ssh/oracle-key;
        echo '[oracle-tunnel] Starting SSH tunnel to ubuntu@'$$ORACLE_ARM_IP;
        while true; do
          ssh -o StrictHostKeyChecking=no
              -o ServerAliveInterval=30
              -o ServerAliveCountMax=3
              -o ExitOnForwardFailure=yes
              -o ConnectTimeout=10
              -i /root/.ssh/oracle-key
              -L 0.0.0.0:4000:localhost:4000
              -L 0.0.0.0:8000:localhost:8000
              -L 0.0.0.0:8080:localhost:8080
              -N ubuntu@$$ORACLE_ARM_IP || true;
          echo '[oracle-tunnel] Disconnected — retrying in 5s...';
          sleep 5;
        done"
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 32M

  # ===========================================================================
  # OpenClaw Init — Fix volume ownership on fresh deploys
  # ===========================================================================
  # Named volumes are root-owned when first created. OpenClaw runs as the
  # 'node' user (UID 1000) and needs write access to its data directory.
  # This one-shot container ensures correct ownership before OpenClaw starts.
  openclaw-init:
    image: alpine:3
    container_name: openclaw-init
    volumes:
      - openclaw-data:/data
    command: chown -R 1000:1000 /data
    restart: "no"

  # ===========================================================================
  # OpenClaw — Autonomous AI Agent (24/7)
  # ===========================================================================
  # Open-source autonomous AI agent (Node.js). Connects to LLM providers
  # and messaging platforms (Telegram, Discord, WhatsApp, Signal, etc.)
  #
  # FIRST RUN: After 'docker compose up -d', run the onboarding wizard:
  #   docker compose exec -it openclaw node openclaw.mjs onboard
  #
  # Web interface available at /openclaw/ via Caddy reverse proxy.
  # Agent workspace served at /workspace/ — agents can create pages and features here.
  # Config persisted in openclaw-data volume (~/.openclaw/).
  # See README Part 4 for full setup guide.
  openclaw:
    image: ghcr.io/openclaw/openclaw:main
    container_name: openclaw
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - openclaw-data:/home/node/.openclaw
      - agent-workspace:/workspace
      - ./scripts:/opt/scripts:ro
      # Oracle ARM SSH key — agents use exec ssh to access Oracle for builds/deploys
      - ./oracle-instance-key:/opt/oracle/ssh-key:ro
    command: ["/bin/sh", "/opt/scripts/openclaw-entrypoint.sh"]
    environment:
      # Skip entry.js respawn — we supply the V8 flags and warning suppression directly
      - OPENCLAW_NODE_OPTIONS_READY=1
      - NODE_OPTIONS=--max-old-space-size=1024 --disable-warning=ExperimentalWarning
      # Gateway auth — password required to access the /openclaw/ web UI
      - OPENCLAW_GATEWAY_PASSWORD=${OPENCLAW_PASSWORD}
      # Domain for OpenClaw allowedOrigins (v2026.2.24+ requirement)
      - DOMAIN=${DOMAIN:-}
      # Route everything through LiteLLM on Oracle ARM
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_BASE_URL=${ORACLE_LITELLM_URL:-http://localhost:4000}/v1
      # Pass raw URL too — patch-openclaw-config.js uses it as fallback if OPENAI_API_BASE_URL is empty
      - ORACLE_LITELLM_URL=${ORACLE_LITELLM_URL:-}
      # v2026.3.2: plaintext ws:// restricted to loopback by default.
      # Docker bridge network is private (not loopback) — Caddy proxies
      # to openclaw:18789 via ws:// on the bridge. Without this, internal
      # WebSocket connections fail with connection refused.
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=1
      # Reduce overhead on low-power VMs (t3.small) — skip process respawning
      - OPENCLAW_NO_RESPAWN=1
      # Auto-kickoff: send startup messages to leads on restart (opt-in)
      - OPENCLAW_AUTO_KICKOFF=${OPENCLAW_AUTO_KICKOFF:-1}
      - OPENCLAW_PASSWORD=${OPENCLAW_PASSWORD}
      # Oracle Cloud ARM — agents SSH here for builds, deploys, background compute
      - ORACLE_ARM_IP=${ORACLE_ARM_IP:-}
      - ORACLE_ARM_IP_2=${ORACLE_ARM_IP_2:-}
      # Native Ollama provider — direct connection for tool calling + streaming
      # (LiteLLM OpenAI-compat /v1 silently drops tool calls when streaming)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      # Gemini API key — used directly by OpenClaw for memory_search embeddings
      # (free, 1500 RPM, avoids LiteLLM proxy hop for embedding calls)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Telegram bot integration (optional — set in .env)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # Oracle ARM service URLs — agents use these in exec wget calls
      - ORACLE_SCRAPLING_URL=${ORACLE_SCRAPLING_URL:-http://localhost:8000}
      - ORACLE_SEARXNG_URL=${ORACLE_SEARXNG_URL:-http://localhost:8080}
    networks:
      - ai-net
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18789/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ===========================================================================
  # Webhook Handler — Lightweight endpoint for external workflow triggers
  # ===========================================================================
  # Receives POST requests from external services (GitHub, Stripe, etc.),
  # validates per-webhook tokens, and triggers workflow execution via OpenClaw.
  # Internal only — proxied through Caddy at /api/webhook/*.
  webhook:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    image: in-fused/webhook:latest
    container_name: webhook
    restart: unless-stopped
    volumes:
      - agent-workspace:/workspace
    environment:
      - OPENCLAW_PASSWORD=${OPENCLAW_PASSWORD}
      - DOMAIN=${DOMAIN:-in-fused.org}
      - WEBHOOK_ARCHIVE_URL=${WEBHOOK_ARCHIVE_URL:-}
      - WEBHOOK_ARCHIVE_TOKEN=${WEBHOOK_ARCHIVE_TOKEN:-}
      - WEBHOOK_ARCHIVE_AFTER_MINS=${WEBHOOK_ARCHIVE_AFTER_MINS:-30}
    networks:
      - ai-net
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # Paperclip — AI Agent Orchestration Layer
  # ===========================================================================
  # Open-source orchestration for managing agent teams (org charts, budgets,
  # governance, goal alignment). Replaces custom governance/workflow code.
  # Built from source — no pre-built image on ghcr.io.
  # UI + API at /paperclip/ via Caddy.
  paperclip:
    build:
      context: ./paperclip
      dockerfile: Dockerfile
    image: in-fused/paperclip:latest
    container_name: paperclip
    restart: unless-stopped
    depends_on:
      paperclip-db:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=3100
      - PAPERCLIP_HOME=/paperclip
      - DATABASE_URL=postgresql://paperclip:${PAPERCLIP_DB_PASSWORD}@paperclip-db:5432/paperclip
      - NODE_ENV=production
      - PAPERCLIP_DEPLOYMENT_MODE=authenticated
      - PAPERCLIP_DEPLOYMENT_EXPOSURE=private
      - PAPERCLIP_PUBLIC_URL=https://${DOMAIN:-localhost}/paperclip
      # Better Auth URL must be the origin only (no /paperclip path) because
      # Caddy handle_path strips the /paperclip/ prefix before proxying.
      # If the path is included, Better Auth registers routes at /paperclip/api/auth/*
      # which never match (server only sees /api/auth/* after Caddy strip).
      - BETTER_AUTH_URL=https://${DOMAIN:-localhost}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_TRUSTED_ORIGINS=https://${DOMAIN:-localhost}
    volumes:
      - paperclip-data:/paperclip
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3100/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # Paperclip Database — PostgreSQL (required by paperclip)
  # ===========================================================================
  paperclip-db:
    image: postgres:17-alpine
    container_name: paperclip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${PAPERCLIP_DB_PASSWORD}
      POSTGRES_DB: paperclip
    volumes:
      - paperclip-pgdata:/var/lib/postgresql/data
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ===========================================================================
  # Workspace Init — Seeds the agent workspace volume with placeholder content
  # ===========================================================================
  # Runs once on deploy to sync workspace/ seed files into the shared volume.
  # Always copies seed files (so Mission Control updates are deployed).
  # Agent-created files in other paths are preserved.
  workspace-init:
    image: alpine:3
    container_name: workspace-init
    volumes:
      - ./workspace:/seed:ro
      - agent-workspace:/workspace
    command: >
      sh -c "cp -r /seed/. /workspace/ &&
        mkdir -p /workspace/agent-workflows /workspace/agent-workflows/results /workspace/staging /workspace/agent-activity /workspace/mc-state /workspace/prompts /workspace/webhook-triggers &&
        [ -f /workspace/agent-workflows/index.json ] || echo '{\"workflows\":[]}' > /workspace/agent-workflows/index.json &&
        [ -f /workspace/agent-workflows/results/index.json ] || echo '{\"results\":[]}' > /workspace/agent-workflows/results/index.json &&
        [ -f /workspace/staging/index.json ] || echo '{\"items\":[]}' > /workspace/staging/index.json &&
        [ -f /workspace/webhook-triggers/index.json ] || echo '{\"triggers\":[]}' > /workspace/webhook-triggers/index.json &&
        [ -f /workspace/agent-activity/log.json ] || echo '{\"events\":[]}' > /workspace/agent-activity/log.json &&
        [ -f /workspace/mc-state/governance.json ] || echo '{\"agents\":{},\"teams\":[],\"updatedAt\":0}' > /workspace/mc-state/governance.json &&
        chown -R 1000:1000 /workspace/agent-workflows /workspace/agent-workflows/results /workspace/staging /workspace/agent-activity /workspace/mc-state /workspace/prompts /workspace/webhook-triggers &&
        echo 'Workspace synced + bridge dirs ready (owned by node:1000)'"
    restart: "no"

  # ===========================================================================
  # Watchtower — Auto-Update OpenClaw Container
  # ===========================================================================
  # Monitors the OpenClaw container image and auto-pulls new versions.
  # Checks daily at 4 AM UTC. Only watches openclaw (label filter).
  # After pulling a new image, restarts the container automatically.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Only update containers with the enable label (openclaw)
      - WATCHTOWER_LABEL_ENABLE=true
      # Check daily at 4:00 AM UTC
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      # Remove old images after updating
      - WATCHTOWER_CLEANUP=true
      # Log only, no external notifications
      - WATCHTOWER_NO_STARTUP_MESSAGE=false
    deploy:
      resources:
        limits:
          memory: 64M

  # ===========================================================================
  # Ollama — Local LLM Server (OPTIONAL — for same-box deployment)
  # ===========================================================================
  # Only enable if running Ollama on THIS server (GPU instance recommended).
  # For Oracle Cloud deployment, use scripts/setup-ollama-server.sh instead.
  #
  # Enable with: docker compose --profile local-models up -d
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    profiles:
      - local-models
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 4G

# =============================================================================
# Networks
# =============================================================================
networks:
  ai-net:
    driver: bridge
    name: ai-hub-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  caddy-data:
  caddy-config:
  openclaw-data:
  agent-workspace:
  paperclip-data:
  paperclip-pgdata:
  ollama-data:
