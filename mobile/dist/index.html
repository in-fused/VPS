<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mission Control</title>
  <style>
    body { background: #0a0e17; color: #c9a44a; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .msg { padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    p { opacity: 0.7; line-height: 1.6; }
    button { background: #c9a44a; color: #0a0e17; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 600; margin-top: 1.5rem; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="msg">
    <h1>Mission Control</h1>
    <p>Cannot reach in-fused.org<br>Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
