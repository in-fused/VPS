<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>in-fused.org</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #60a5fa;
      --amber: #f59e0b;
      --green: #22c55e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      max-width: 720px;
      width: 100%;
      padding: 2rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      text-shadow: 0 0 40px rgba(96, 165, 250, 0.2);
    }

    .tagline {
      color: #555;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    /* Navigation Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1.5rem 1rem;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .card:hover { transform: translateY(-2px); }

    .card-icon { font-size: 1.5rem; line-height: 1; }
    .card-title { font-size: 0.95rem; font-weight: 600; color: #ddd; }
    .card-desc { font-size: 0.7rem; color: #666; }

    /* Card accents */
    .card-chat .card-icon { color: var(--blue); }
    .card-chat:hover {
      border-color: rgba(96, 165, 250, 0.3);
      box-shadow: 0 8px 30px rgba(96, 165, 250, 0.12);
    }

    .card-agents .card-icon { color: var(--amber); }
    .card-agents:hover {
      border-color: rgba(245, 158, 11, 0.3);
      box-shadow: 0 8px 30px rgba(245, 158, 11, 0.12);
    }

    .card-api .card-icon { color: var(--green); }
    .card-api:hover {
      border-color: rgba(34, 197, 94, 0.3);
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.12);
    }

    /* Status Section */
    .status-heading {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
      text-align: center;
      margin-bottom: 0.75rem;
    }

    .status-row {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
    }

    .status-dot.online {
      background: var(--green);
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
    }

    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
    }

    .status-name {
      font-size: 0.75rem;
      color: #666;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>in-fused</h1>
      <p class="tagline">Autonomous AI Hub</p>
    </header>

    <nav class="cards">
      <a href="/chat" class="card card-chat">
        <span class="card-icon">&#9677;</span>
        <span class="card-title">Chat</span>
        <span class="card-desc">Open WebUI</span>
      </a>
      <a href="/openclaw/" class="card card-agents">
        <span class="card-icon">&#9889;</span>
        <span class="card-title">Agents</span>
        <span class="card-desc">OpenClaw</span>
      </a>
      <a href="/api/litellm/" class="card card-api">
        <span class="card-icon">&#9678;</span>
        <span class="card-title">API</span>
        <span class="card-desc">LiteLLM</span>
      </a>
    </nav>

    <section>
      <p class="status-heading">Service Status</p>
      <div class="status-row">
        <div class="status-item">
          <span class="status-dot" id="status-webui"></span>
          <span class="status-name">Open WebUI</span>
        </div>
        <div class="status-item">
          <span class="status-dot" id="status-litellm"></span>
          <span class="status-name">LiteLLM</span>
        </div>
        <div class="status-item">
          <span class="status-dot" id="status-openclaw"></span>
          <span class="status-name">OpenClaw</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    async function checkHealth(id, url) {
      const dot = document.getElementById(id);
      try {
        const res = await fetch(url, { cache: 'no-cache' });
        dot.className = 'status-dot ' + (res.ok ? 'online' : 'offline');
      } catch {
        dot.className = 'status-dot offline';
      }
    }

    function checkAll() {
      checkHealth('status-webui', '/chat');
      checkHealth('status-litellm', '/api/litellm/health/liveliness');
      checkHealth('status-openclaw', '/openclaw/');
    }

    checkAll();
    setInterval(checkAll, 30000);
  </script>
</body>
</html>
