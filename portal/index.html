<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>in-fused.org</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #60a5fa;
      --amber: #f59e0b;
      --green: #22c55e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      max-width: 720px;
      width: 100%;
      padding: 2rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      text-shadow: 0 0 40px rgba(96, 165, 250, 0.2);
    }

    .tagline {
      color: #555;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    /* Navigation Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1.5rem 1rem;
      text-decoration: none;
      font: inherit;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .card:hover { transform: translateY(-2px); }

    .card-icon { font-size: 1.5rem; line-height: 1; }
    .card-title { font-size: 0.95rem; font-weight: 600; color: #ddd; }
    .card-desc { font-size: 0.7rem; color: #666; }

    /* Card accents */
    .card-chat .card-icon { color: var(--blue); }
    .card-chat:hover {
      border-color: rgba(96, 165, 250, 0.3);
      box-shadow: 0 8px 30px rgba(96, 165, 250, 0.12);
    }

    .card-agents .card-icon { color: var(--amber); }
    .card-agents:hover {
      border-color: rgba(245, 158, 11, 0.3);
      box-shadow: 0 8px 30px rgba(245, 158, 11, 0.12);
    }

    .card-status .card-icon { color: var(--green); }
    .card-status:hover,
    .card-status.active {
      border-color: rgba(34, 197, 94, 0.3);
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.12);
    }

    /* Status Panel */
    .status-panel {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: none;
    }

    .status-panel.open { display: block; }

    .panel-services {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .svc {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #888;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
    }

    .dot.online {
      background: var(--green);
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
    }

    .dot.offline {
      background: #ef4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
    }

    .panel-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
      margin-bottom: 0.5rem;
    }

    .model-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .model-tag {
      font-size: 0.7rem;
      color: #777;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
    }

    .model-list .note {
      font-size: 0.7rem;
      color: #555;
      font-style: italic;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>in-fused</h1>
      <p class="tagline">Autonomous AI Hub</p>
    </header>

    <nav class="cards">
      <a href="/chat" class="card card-chat">
        <span class="card-icon">&#9677;</span>
        <span class="card-title">Chat</span>
        <span class="card-desc">Open WebUI</span>
      </a>
      <a href="/openclaw/" class="card card-agents">
        <span class="card-icon">&#9889;</span>
        <span class="card-title">Agents</span>
        <span class="card-desc">OpenClaw</span>
      </a>
      <button class="card card-status" id="status-btn" onclick="toggleStatus()">
        <span class="card-icon">&#9678;</span>
        <span class="card-title">Status</span>
        <span class="card-desc">Health & Models</span>
      </button>
    </nav>

    <section class="status-panel" id="status-panel">
      <div class="panel-services">
        <div class="svc"><span class="dot" id="dot-webui"></span> Open WebUI</div>
        <div class="svc"><span class="dot" id="dot-litellm"></span> LiteLLM</div>
        <div class="svc"><span class="dot" id="dot-openclaw"></span> OpenClaw</div>
      </div>
      <p class="panel-label">Available Models</p>
      <div class="model-list" id="model-list">
        <span class="note">Loading...</span>
      </div>
    </section>
  </main>

  <script>
    async function checkHealth(id, url) {
      const dot = document.getElementById(id);
      try {
        const res = await fetch(url, { cache: 'no-cache' });
        dot.className = 'dot ' + (res.ok ? 'online' : 'offline');
      } catch {
        dot.className = 'dot offline';
      }
    }

    async function loadModels() {
      const el = document.getElementById('model-list');
      try {
        const res = await fetch('/api/litellm/v1/models', { cache: 'no-cache' });
        if (!res.ok) throw new Error();
        const data = await res.json();
        const models = (data.data || []).map(m => m.id).sort();
        if (models.length === 0) {
          el.innerHTML = '<span class="note">No models available</span>';
          return;
        }
        el.innerHTML = models.map(m => '<span class="model-tag">' + m + '</span>').join('');
      } catch {
        el.innerHTML = '<span class="note">Could not load models</span>';
      }
    }

    function checkAll() {
      checkHealth('dot-webui', '/health');
      checkHealth('dot-litellm', '/api/litellm/health/liveliness');
      checkHealth('dot-openclaw', '/openclaw/');
    }

    function toggleStatus() {
      const panel = document.getElementById('status-panel');
      const btn = document.getElementById('status-btn');
      const isOpen = panel.classList.toggle('open');
      btn.classList.toggle('active', isOpen);
      if (isOpen) {
        checkAll();
        loadModels();
      }
    }

    // Run health checks on load so panel is pre-populated
    checkAll();
    loadModels();
    setInterval(checkAll, 30000);
  </script>
</body>
</html>
