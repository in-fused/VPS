<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>in-fused.org</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #60a5fa;
      --blue-dim: rgba(96, 165, 250, 0.15);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.15);
      --green: #22c55e;
      --green-dim: rgba(34, 197, 94, 0.15);
      --bg: #050508;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: #e0e0e0;
      min-height: 100vh;
      overflow: hidden;
      transition: background 0.8s ease;
    }

    /* ===== Neural Network Canvas ===== */
    #neural-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ===== Scene Wrapper (perspective container) ===== */
    .scene-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      perspective: 1200px;
      perspective-origin: 50% 35%;
      transition: opacity 0.6s ease;
    }

    body.zone-active .scene-wrapper {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== Brand ===== */
    .brand {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      text-shadow: 0 0 40px rgba(96, 165, 250, 0.25);
      position: relative;
      z-index: 2;
    }

    .tagline {
      color: #555;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      position: relative;
      z-index: 2;
    }

    /* ===== 3D Terrarium ===== */
    .terrarium {
      position: relative;
      width: 500px;
      height: 400px;
      transform-style: preserve-3d;
      transform: rotateX(55deg) rotateZ(-45deg);
      transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
      margin-bottom: 2rem;
    }

    /* Ground plane */
    .ground {
      position: absolute;
      inset: -40px;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 39px,
          rgba(96, 165, 250, 0.04) 39px,
          rgba(96, 165, 250, 0.04) 40px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 39px,
          rgba(96, 165, 250, 0.04) 39px,
          rgba(96, 165, 250, 0.04) 40px
        );
      border: 1px solid rgba(96, 165, 250, 0.06);
      border-radius: 4px;
      transform: translateZ(0);
    }

    /* Ground glow */
    .ground::after {
      content: '';
      position: absolute;
      inset: 20%;
      background: radial-gradient(ellipse, rgba(96, 165, 250, 0.06) 0%, transparent 70%);
      border-radius: 50%;
    }

    /* ===== Zone Platforms ===== */
    .zone {
      position: absolute;
      width: 160px;
      height: 120px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      transform: translateZ(15px);
      transform-style: preserve-3d;
      transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
      user-select: none;
    }

    .zone::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: -1;
    }

    .zone:hover {
      transform: translateZ(50px);
    }

    .zone:hover::before {
      opacity: 1;
    }

    .zone:active {
      transform: translateZ(35px);
      transition-duration: 0.1s;
    }

    .zone-icon {
      font-size: 1.8rem;
      line-height: 1;
      transform: translateZ(5px);
    }

    .zone-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #ddd;
      text-align: center;
      transform: translateZ(3px);
    }

    .zone-label span {
      display: block;
      font-size: 0.65rem;
      font-weight: 400;
      color: #666;
      margin-top: 2px;
    }

    /* Chat zone — blue */
    .zone-chat {
      top: 30px;
      left: 40px;
      border-color: rgba(96, 165, 250, 0.12);
    }
    .zone-chat::before {
      background: linear-gradient(135deg, var(--blue-dim), transparent);
      box-shadow: 0 0 40px rgba(96, 165, 250, 0.15);
    }
    .zone-chat:hover {
      border-color: rgba(96, 165, 250, 0.3);
      box-shadow: 0 25px 50px -10px rgba(96, 165, 250, 0.2);
    }
    .zone-chat .zone-icon { color: var(--blue); }

    /* Agents zone — amber */
    .zone-agents {
      top: 50px;
      right: 40px;
      border-color: rgba(245, 158, 11, 0.12);
    }
    .zone-agents::before {
      background: linear-gradient(135deg, var(--amber-dim), transparent);
      box-shadow: 0 0 40px rgba(245, 158, 11, 0.15);
    }
    .zone-agents:hover {
      border-color: rgba(245, 158, 11, 0.3);
      box-shadow: 0 25px 50px -10px rgba(245, 158, 11, 0.2);
    }
    .zone-agents .zone-icon { color: var(--amber); }

    /* Status zone — green */
    .zone-status {
      bottom: 40px;
      left: 50%;
      margin-left: -80px;
      border-color: rgba(34, 197, 94, 0.12);
    }
    .zone-status::before {
      background: linear-gradient(135deg, var(--green-dim), transparent);
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.15);
    }
    .zone-status:hover {
      border-color: rgba(34, 197, 94, 0.3);
      box-shadow: 0 25px 50px -10px rgba(34, 197, 94, 0.2);
    }
    .zone-status .zone-icon { color: var(--green); }

    /* Status dot animation inside zone */
    .status-pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ===== Nav Links (below terrarium) ===== */
    .nav {
      display: flex;
      gap: 0.6rem;
      position: relative;
      z-index: 2;
    }

    .nav a {
      color: #444;
      text-decoration: none;
      padding: 0.35rem 0.7rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      font-size: 0.7rem;
      transition: all 0.2s ease;
    }

    .nav a:hover {
      color: var(--blue);
      border-color: rgba(96, 165, 250, 0.2);
    }

    /* ===== Zone Overlays ===== */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-back {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 60;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      color: #999;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .overlay-back:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Agents overlay — OpenClaw iframe */
    .iframe-wrap {
      width: 92vw;
      height: 88vh;
      max-width: 1400px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(10, 10, 15, 0.5);
      border: 1px solid rgba(245, 158, 11, 0.15);
      box-shadow: 0 0 80px rgba(245, 158, 11, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transform: scale(0.96);
      transition: transform 0.5s ease, box-shadow 0.5s ease;
    }

    .overlay.active .iframe-wrap {
      transform: scale(1);
    }

    .iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 16px;
    }

    /* Animated glow border for iframe */
    .iframe-wrap::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 18px;
      background: conic-gradient(
        from var(--glow-angle, 0deg),
        transparent 0%,
        rgba(245, 158, 11, 0.25) 10%,
        transparent 20%,
        transparent 50%,
        rgba(245, 158, 11, 0.15) 60%,
        transparent 70%
      );
      z-index: -1;
      animation: glow-spin 5s linear infinite;
    }

    @property --glow-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes glow-spin {
      to { --glow-angle: 360deg; }
    }

    /* Status overlay — dashboard */
    .status-dashboard {
      width: 90vw;
      max-width: 900px;
      background: rgba(10, 10, 15, 0.5);
      border: 1px solid rgba(34, 197, 94, 0.12);
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transform: scale(0.96);
      transition: transform 0.5s ease;
    }

    .overlay.active .status-dashboard {
      transform: scale(1);
    }

    .dash-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 1.5rem;
    }

    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .dash-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 1.2rem;
    }

    .dash-card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }

    .dash-card-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      transition: all 0.3s ease;
    }

    .dash-card-dot.online {
      background: var(--green);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
    }

    .dash-card-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }

    .dash-card-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #ccc;
    }

    .dash-card-detail {
      font-size: 0.75rem;
      color: #666;
      line-height: 1.5;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .terrarium {
        width: 320px;
        height: 300px;
        transform: rotateX(50deg) rotateZ(-45deg);
      }
      .zone {
        width: 120px;
        height: 90px;
      }
      .zone-chat { top: 15px; left: 15px; }
      .zone-agents { top: 30px; right: 15px; }
      .zone-status { bottom: 20px; }
      .zone-icon { font-size: 1.4rem; }
      .zone-label { font-size: 0.75rem; }
      .brand { font-size: 1.5rem; }
      .iframe-wrap { width: 96vw; height: 90vh; border-radius: 10px; }
      .status-dashboard { padding: 1.5rem; }
    }

    @media (max-width: 480px) {
      .terrarium {
        width: 260px;
        height: 260px;
      }
      .zone { width: 100px; height: 75px; }
      .zone-icon { font-size: 1.1rem; }
      .zone-label { font-size: 0.65rem; }
    }
  </style>
</head>
<body>
  <canvas id="neural-canvas"></canvas>

  <!-- Scene -->
  <div class="scene-wrapper" id="scene">
    <h1 class="brand">in-fused</h1>
    <p class="tagline">Autonomous AI Hub</p>

    <div class="terrarium" id="terrarium">
      <div class="ground"></div>

      <div class="zone zone-chat" onclick="enterChat()" role="button" tabindex="0">
        <div class="zone-icon">&#9677;</div>
        <div class="zone-label">Chat<span>Open WebUI</span></div>
      </div>

      <div class="zone zone-agents" onclick="enterAgents()" role="button" tabindex="0">
        <div class="zone-icon">&#9889;</div>
        <div class="zone-label">Agents<span>OpenClaw</span></div>
      </div>

      <div class="zone zone-status" onclick="enterStatus()" role="button" tabindex="0">
        <div class="zone-icon"><span class="status-pulse"></span></div>
        <div class="zone-label">Status<span>System Health</span></div>
      </div>
    </div>

    <nav class="nav">
      <a href="/chat">Open WebUI</a>
      <a href="/openclaw/">OpenClaw Direct</a>
      <a href="/api/litellm/">LiteLLM API</a>
    </nav>
  </div>

  <!-- Agents Overlay -->
  <div class="overlay" id="agents-overlay">
    <button class="overlay-back" onclick="exitZone()">&#8592; Back to miniverse</button>
    <div class="iframe-wrap">
      <iframe id="openclaw-frame" allow="clipboard-write" loading="lazy"></iframe>
    </div>
  </div>

  <!-- Status Overlay -->
  <div class="overlay" id="status-overlay">
    <button class="overlay-back" onclick="exitZone()">&#8592; Back to miniverse</button>
    <div class="status-dashboard">
      <h2 class="dash-title">System Health</h2>
      <div class="dash-grid" id="dash-grid"></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // Neural Network Canvas
    // =========================================================================
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');
    let nodes = [];
    let mouse = { x: -1000, y: -1000 };
    let activeZone = null;
    let colorTransition = 0; // 0=blue, 1=amber, 2=green
    let targetColor = 0;

    const NODE_DESKTOP = 60;
    const NODE_MOBILE = 30;
    const CONN_DIST = 170;
    const MOUSE_RAD = 200;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function isMobile() { return window.innerWidth < 768; }

    function initNodes() {
      const count = isMobile() ? NODE_MOBILE : NODE_DESKTOP;
      nodes = [];
      for (let i = 0; i < count; i++) {
        nodes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 1.8 + 0.8,
          a: Math.random() * 0.35 + 0.15,
        });
      }
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    // Color interpolation: blue(0) → amber(1) or green(2)
    function nodeRGB() {
      if (targetColor === 1) { // amber
        return [lerp(96,245,colorTransition), lerp(165,158,colorTransition), lerp(250,11,colorTransition)];
      }
      if (targetColor === 2) { // green
        return [lerp(96,34,colorTransition), lerp(165,197,colorTransition), lerp(250,94,colorTransition)];
      }
      // blue (default or returning)
      return [lerp(96,96,0), lerp(165,165,0), lerp(250,250,0)];
    }

    function lineRGB() {
      if (targetColor === 1) {
        return [lerp(30,146,colorTransition), lerp(58,100,colorTransition), lerp(95,6,colorTransition)];
      }
      if (targetColor === 2) {
        return [lerp(30,20,colorTransition), lerp(58,120,colorTransition), lerp(95,50,colorTransition)];
      }
      return [30, 58, 95];
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Color transition easing
      if (targetColor === 0) {
        colorTransition += (0 - colorTransition) * 0.03;
      } else {
        colorTransition += (1 - colorTransition) * 0.025;
      }

      const speedMult = activeZone ? 1.6 : 1;
      const distMult = activeZone ? 1.25 : 1;
      const connDist = CONN_DIST * distMult;
      const [nr, ng, nb] = nodeRGB();
      const [lr, lg, lb] = lineRGB();

      for (const n of nodes) {
        n.x += n.vx * speedMult;
        n.y += n.vy * speedMult;
        if (n.x < -10) n.x = canvas.width + 10;
        if (n.x > canvas.width + 10) n.x = -10;
        if (n.y < -10) n.y = canvas.height + 10;
        if (n.y > canvas.height + 10) n.y = -10;

        const dx = mouse.x - n.x;
        const dy = mouse.y - n.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MOUSE_RAD && dist > 0) {
          const f = (1 - dist / MOUSE_RAD) * 0.012;
          n.vx += dx * f;
          n.vy += dy * f;
        }
        n.vx *= 0.992;
        n.vy *= 0.992;
      }

      // Connections
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < connDist) {
            const alpha = (1 - dist / connDist) * 0.3;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.strokeStyle = `rgba(${lr|0},${lg|0},${lb|0},${alpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      // Nodes
      for (const n of nodes) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${nr|0},${ng|0},${nb|0},${n.a})`;
        ctx.fill();

        const gs = n.r * 3.5;
        const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, gs);
        g.addColorStop(0, `rgba(${nr|0},${ng|0},${nb|0},${n.a * 0.25})`);
        g.addColorStop(1, `rgba(${nr|0},${ng|0},${nb|0},0)`);
        ctx.beginPath();
        ctx.arc(n.x, n.y, gs, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    // =========================================================================
    // Zone Navigation
    // =========================================================================
    function enterChat() {
      window.location.href = '/chat';
    }

    function enterAgents() {
      activeZone = 'agents';
      targetColor = 1;
      document.body.classList.add('zone-active');
      document.getElementById('agents-overlay').classList.add('active');

      const frame = document.getElementById('openclaw-frame');
      if (!frame.src) frame.src = '/openclaw/';
    }

    function enterStatus() {
      activeZone = 'status';
      targetColor = 2;
      document.body.classList.add('zone-active');
      document.getElementById('status-overlay').classList.add('active');
      refreshStatus();
    }

    function exitZone() {
      targetColor = 0;
      activeZone = null;
      document.body.classList.remove('zone-active');
      document.getElementById('agents-overlay').classList.remove('active');
      document.getElementById('status-overlay').classList.remove('active');
    }

    // Keyboard: Escape exits, Enter activates focused zone
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && activeZone) exitZone();
    });

    // =========================================================================
    // Status Dashboard
    // =========================================================================
    const services = [
      { name: 'Open WebUI', desc: 'Chat interface', url: '/', id: 'webui' },
      { name: 'LiteLLM', desc: 'Model routing API', url: '/api/litellm/health/liveliness', id: 'litellm' },
      { name: 'OpenClaw', desc: 'Agent gateway', url: '/openclaw/', id: 'openclaw' },
    ];

    async function checkService(svc) {
      try {
        await fetch(svc.url, { method: 'HEAD', mode: 'no-cors' });
        return true;
      } catch { return false; }
    }

    async function refreshStatus() {
      const grid = document.getElementById('dash-grid');
      grid.innerHTML = '';

      for (const svc of services) {
        const online = await checkService(svc);
        const card = document.createElement('div');
        card.className = 'dash-card';
        card.innerHTML = `
          <div class="dash-card-header">
            <div class="dash-card-dot ${online ? 'online' : 'offline'}"></div>
            <div class="dash-card-name">${svc.name}</div>
          </div>
          <div class="dash-card-detail">${svc.desc}<br>${online ? 'Online' : 'Unreachable'}</div>
        `;
        grid.appendChild(card);
      }

      // Try to fetch LiteLLM model list
      try {
        const res = await fetch('/api/litellm/v1/models');
        if (res.ok) {
          const data = await res.json();
          const models = data.data || [];
          if (models.length > 0) {
            const card = document.createElement('div');
            card.className = 'dash-card';
            card.style.gridColumn = '1 / -1';
            card.innerHTML = `
              <div class="dash-card-header">
                <div class="dash-card-dot online"></div>
                <div class="dash-card-name">Available Models (${models.length})</div>
              </div>
              <div class="dash-card-detail">${models.map(m => m.id).join(', ')}</div>
            `;
            grid.appendChild(card);
          }
        }
      } catch {}
    }

    // =========================================================================
    // Mouse / Touch Tracking
    // =========================================================================
    document.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    document.addEventListener('mouseleave', () => {
      mouse.x = -1000; mouse.y = -1000;
    });
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    });
    document.addEventListener('touchend', () => {
      mouse.x = -1000; mouse.y = -1000;
    });

    // =========================================================================
    // Init
    // =========================================================================
    window.addEventListener('resize', () => { resize(); initNodes(); });
    resize();
    initNodes();
    animate();
  </script>
</body>
</html>
